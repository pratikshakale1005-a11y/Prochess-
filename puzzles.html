      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }
    .header {

      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header h2 { color: #00c8ff; font-size: 1.3rem; text-shadow: 0 0 10px rgba(0,200,255,0.4); }
    .status-badge { color: #ffd700; font-weight: bold; font-size: 0.95rem; }

    .reward-tier-bar {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 10px;
      font-size: 0.7rem;
      text-align: center;
    }
    .tier-chip {
      padding: 5px 2px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #333;
      color: #aaa;
    }
    .tier-chip.active-tier {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.15);
      color: #ffd700;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .grid-container {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 25, 35, 0.95);
      border: 1.5px solid #00c8ff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.2);
    }
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .levels-grid::-webkit-scrollbar { width: 4px; }
    .levels-grid::-webkit-scrollbar-thumb { background: #00c8ff; border-radius: 10px; }

    .lvl-btn {
      padding: 10px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #666;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lvl-btn.unlocked { border-color: #00ff88; color: #00ff88; background: rgba(0,255,136,0.08); }
    .lvl-btn.active { background: #00c8ff; color: #000; border-color: #fff; box-shadow: 0 0 10px #00c8ff; }
    .lvl-btn.completed { background: rgba(0, 255, 136, 0.25); border-color: #00ff88; color: #fff; }

    .puzzle-instruction-box {
      width: 100%;
      max-width: 400px;
      background: rgba(10, 15, 25, 0.95);
      border: 1.5px solid #ffd700;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
      text-align: center;

    #currentRewardDisplay { font-size: 0.8rem; color: #ffd700; font-weight: bold; }

    .board-container {
      width: 90vw;
      max-width: 380px;
      aspect-ratio: 1;
      display: grid;
      grid-template: repeat(8, 1fr) / repeat(8, 1fr);
      border: 2px solid #00c8ff;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 0 25px rgba(0, 200, 255, 0.35);
    }
    .sq {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      cursor: pointer;
    }
    .light { background: #e2f1f8; color: #000; }
    .dark { background: #162438; color: #fff; }
    .selected { outline: 2.5px solid #ffd700 inset; background: rgba(255, 215, 0, 0.4) !important; }

    .whitePiece {
      color: #e0f8ff;
      text-shadow: 0 0 4px #fff, 0 0 8px #00c3ff, 0 0 15px #ff5555, 0 0 25px #00aaff, 0 0 40px #80dfff;
      filter: drop-shadow(0 0 10px #00c3ff);
    }
    .blackPiece {
      color: #071a10;
      text-shadow: 0 0 18px #00ff99, 0 0 6px #00ff99;
      filter: drop-shadow(0 0 8px rgba(0, 255, 153, 0.4));
    }
    .piece {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9vw;
      user-select: none;
      pointer-events: none;
    }
    @media (min-width: 420px) { .piece { font-size: 38px; } }

    .btn-back {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      background: transparent;
      border: 1.5px solid #ef4444;
      color: #ef4444;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;

    function parseFEN(fen) {
      const rows = fen.split('/');
      const board = [];
      for (const row of rows) {
        for (const ch of row) {
          if (!isNaN(ch)) {
            const emptyCount = parseInt(ch);
            for (let i = 0; i < emptyCount; i++) board.push("");
          } else {
            board.push(pieceMap[ch] || "");
          }
        }
      }
      return board;

      { desc: "White to move: Queen Corner Laser Mate", fen: "7k/7p/8/8/8/8/8/7Q", f: 63, t: 7 },
      { desc: "White to move: Penultimate Masterpiece", fen: "2rk4/2ppp3/8/8/8/8/8/2R4K", f: 58, t: 2 },
      { desc: "White to move: Level 100 Grandmaster Finish!", fen: "4k3/4p3/8/8/8/8/8/4Q2K", f: 60, t: 12 }
    ];

    // FEN स्ट्रिंग्सचे अचूक ६४ घरांच्या बोर्डमध्ये रूपांतर
    const puzzlesList = rawPuzzles.map(p => ({
      desc: p.desc,
      board: parseFEN(p.fen),
      solution: { from: p.f, to: p.t }
    }));

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2000);
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snap = await get(ref(db, `users/${user.uid}/puzzleLevel`));
        if (snap.exists()) unlockedLevel = Number(snap.val()) || 1;
      } else {
        unlockedLevel = Number(localStorage.getItem("guest_puzzle_level")) || 1;
      }
      currentLevel = unlockedLevel;
      renderGrid();
      loadPuzzle(currentLevel);
    });

    function renderGrid() {
      const grid = document.getElementById("levelsGrid");
      grid.innerHTML = "";

      for (let i = 1; i <= 100; i++) {
        const btn = document.createElement("button");
        btn.className = "lvl-btn";
        btn.innerText = i;

        if (i < unlockedLevel) {
          btn.classList.add("completed");
          btn.onclick = () => loadPuzzle(i);
        } else if (i === unlockedLevel) {
          btn.classList.add("unlocked");
          if (i === currentLevel) btn.classList.add("active");
          btn.onclick = () => loadPuzzle(i);
        } else {
          btn.disabled = true;
          btn.style.opacity = "0.3";
        }
        grid.appendChild(btn);
      }
      document.getElementById("lvlStatus").innerText = `Level: ${currentLevel} / 100`;

      document.querySelectorAll(".tier-chip").forEach(c => c.classList.remove("active-tier"));
      if (currentLevel <= 25) document.getElementById("chip1")?.classList.add("active-tier");
      else if (currentLevel <= 50) document.getElementById("chip2")?.classList.add("active-tier");
      else if (currentLevel <= 75) document.getElementById("chip3")?.classList.add("active-tier");
      else document.getElementById("chip4")?.classList.add("active-tier");
    }

    let activeBoard = [];
    let activeSolution = null;

    function loadPuzzle(lvl) {
      currentLevel = lvl;
      renderGrid();

      const template = puzzlesList[lvl - 1] || puzzlesList[0];

      activeBoard = [...template.board];
      activeSolution = template.solution;

      const descEl = document.getElementById("puzzleDescription");
      const rewardEl = document.getElementById("currentRewardDisplay");
      const rewardCoins = getCoinsReward(lvl);

      if (descEl) descEl.innerText = `Lvl ${lvl}: ${template.desc}`;
      if (rewardEl) rewardEl.innerText = `Reward: +${rewardCoins} Coins 🪙`;

      selectedSquare = null;
      renderBoard();
      showToast(`Level ${lvl} | Reward: +${rewardCoins} Coins 🪙`);
    }

    function renderBoard() {
      const boardEl = document.getElementById("puzzleBoard");
      boardEl.innerHTML = "";

      for (let i = 0; i < 64; i++) {
        const sq = document.createElement("div");
        const isLight = (Math.floor(i / 8) + (i % 8)) % 2 === 0;
        sq.className = `sq ${isLight ? "light" : "dark"}`;

        if (selectedSquare === i) sq.classList.add("selected");

        const pieceChar = activeBoard[i];
        if (pieceChar) {
          const pieceDiv = document.createElement("div");
          pieceDiv.textContent = pieceChar;
          if (isWhitePiece(pieceChar)) pieceDiv.className = "piece whitePiece";
          else if (isBlackPiece(pieceChar)) pieceDiv.className = "piece blackPiece";
          else pieceDiv.className = "piece";
          sq.appendChild(pieceDiv);
        }

        sq.onclick = () => onSquareClick(i);
        boardEl.appendChild(sq);
      }
    }

    async function onSquareClick(i) {
      if (selectedSquare === null) {
        if (activeBoard[i]) {
          selectedSquare = i;
          renderBoard();
        }
      } else {
        const from = selectedSquare;
        const to = i;

        if (from === activeSolution.from && to === activeSolution.to) {
          activeBoard[to] = activeBoard[from];
          activeBoard[from] = "";
          selectedSquare = null;
          renderBoard();

          const earnedReward = getCoinsReward(currentLevel);
          showToast(`🎉 Correct! +${earnedReward} Coins 🪙`);

          if (currentLevel === unlockedLevel && unlockedLevel < 100) {
            unlockedLevel++;
            localStorage.setItem("guest_puzzle_level", unlockedLevel);

            let coins = Number(localStorage.getItem("coins")) || 500;
            coins += earnedReward;
            localStorage.setItem("coins", coins);

            if (currentUser) {
              await update(ref(db, `users/${currentUser.uid}`), {
                puzzleLevel: unlockedLevel,
                coins: coins
              });
            }
          }

          setTimeout(() => { loadPuzzle(currentLevel + 1); }, 1000);
        } else {
          showToast("❌ Wrong move! Try again.");
          selectedSquare = null;
          renderBoard();
        }
      }
    }
  </script>
</body>
</html>
